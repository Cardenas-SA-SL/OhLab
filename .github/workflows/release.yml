name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run for an existing tag (the tag's own run picks up the workflow file AT the tag, so a
  # workflow fix can only be exercised through this trigger or a new tag).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-mac:
    name: macOS packages
    runs-on: macos-14
    env:
      # The two-arch electron-vite + electron-builder run exceeded Node's default ~2 GB heap on the
      # 7 GB macos-14 runner (v0.4.0's first run died with "JavaScript heap out of memory").
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # This produces one universal tmux binary with static libevent and utf8proc. The script
      # verifies both Mach-O slices and refuses Homebrew dylib dependencies before packaging.
      - name: Build bundled tmux
        run: node scripts/build-tmux.mjs

      # electron-builder runs @electron/rebuild once per target architecture. That gives node-pty
      # and smart-whisper the matching Electron ABI and CPU architecture in each packaged app.
      - name: Build unsigned arm64 and x64 packages
        run: npm run release:mac-unsigned

      - name: Verify packages
        run: |
          version=$(node -p "require('./package.json').version")
          for arch in arm64 x64; do
            test -f "dist/OhLab-${version}-${arch}.dmg"
            test -f "dist/OhLab-${version}-${arch}.zip"
          done
          test -x "dist/mac-arm64/OhLab.app/Contents/Resources/bin/tmux"
          lipo -archs "dist/mac-arm64/OhLab.app/Contents/Resources/bin/tmux" | grep -q arm64
          lipo -archs "dist/mac-arm64/OhLab.app/Contents/Resources/bin/tmux" | grep -q x86_64
          test -f dist/latest-mac.yml

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          repository: Cardenas-SA-SL/OhLab
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
